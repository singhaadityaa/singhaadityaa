<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#f7f4ee}.title{fill:#1d1b18}.body{fill:#5f5952}.muted{fill:#8d857b}.rule{stroke:#d8d1c7}.accent{fill:#7d8772}.eq{fill:#756f67}
    @media(prefers-color-scheme:dark){.bg{fill:#151412}.title{fill:#f1ece5}.body{fill:#b8b0a6}.muted{fill:#888077}.rule{stroke:#34302b}.accent{fill:#96a08b}.eq{fill:#a59d93}}
  </style>

  <rect class="bg" width="1200" height="340" rx="18"/>

  <rect class="accent" x="72" y="58" width="48" height="4" rx="2"/>

  <text class="title" x="72" y="132"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif"
    font-size="58" font-weight="650" letter-spacing="-1.8">Aditya Kumar</text>

  <text class="body" x="72" y="178"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif"
    font-size="23" font-weight="500">CEO, Alle’s ClinX</text>

  <line class="rule" x1="72" y1="220" x2="1128" y2="220"/>

  <text class="body" x="72" y="267"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif"
    font-size="19">Institutional hygiene systems · chemistry · procurement · data · AI</text>

  <text class="muted" x="72" y="300"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Arial,sans-serif"
    font-size="14">building the intelligence around the chemical</text>

  <line class="rule" x1="790" y1="72" x2="790" y2="196"/>

  <g font-family="Georgia,Times New Roman,serif" font-size="20" font-style="italic">
    <text class="eq" x="830" y="96">C₁V₁ = C₂V₂</text>
    <text class="eq" x="830" y="136">pH = −log[H⁺]</text>
    <text class="eq" x="830" y="176">NaOCl + H₂O ⇌ HOCl + Na⁺ + OH⁻</text>
  </g>
</svg>